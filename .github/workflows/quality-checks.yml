name: Quality checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-checks-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  quality-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20.20.2'
          cache: npm

      - name: Locate Composer cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Prepare test environment
        run: |
          cp .env.example .env
          touch database/database.sqlite

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Audit PHP dependencies
        run: composer audit --locked --no-interaction

      - name: Generate application key
        run: php artisan key:generate

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=low

      - name: Run JavaScript tests
        run: npm run test:js

      - name: Build frontend assets
        env:
          VITE_BUILD_DIRECTORY: build-ci
        run: npm run build

      - name: Verify isolated frontend build
        run: |
          test -s public/build-ci/manifest.json
          git diff --exit-code -- public/build

      - name: Detect committed secrets
        run: |
          ! git grep -IlE '(AKIA[0-9A-Z]{16}|ASIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-(proj-)?[A-Za-z0-9_-]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|base64:[A-Za-z0-9+/]{40,}={0,2})' -- .
          ! git grep -IlE '^APP_KEY=.+$' -- .

      - name: Check code style
        run: vendor/bin/pint --test

      - name: Rebuild and seed the SQLite database reproducibly
        run: |
          php artisan migrate:fresh --seed --force
          php artisan db:seed --class=LeadDemoSeeder --force

      - name: Run Laravel tests
        run: php artisan test

      - name: Simulate the production build twice
        run: |
          bash scripts/prepare-production.sh
          php scripts/production-snapshot.php database/demo.sqlite > /tmp/leadops-first.json
          sha256sum database/demo.sqlite | cut -d ' ' -f 1 > /tmp/leadops-first.sha256
          bash scripts/prepare-production.sh
          php scripts/production-snapshot.php database/demo.sqlite > /tmp/leadops-second.json
          sha256sum database/demo.sqlite | cut -d ' ' -f 1 > /tmp/leadops-second.sha256
          diff --brief /tmp/leadops-first.json /tmp/leadops-second.json
          diff --brief /tmp/leadops-first.sha256 /tmp/leadops-second.sha256
          grep -F '"counts":{"leads":8,"events":68,"jobs":0}' /tmp/leadops-second.json
          test "$(stat -c '%a' database/demo.sqlite)" = 444
          test ! -e database/demo.sqlite-wal
          test ! -e database/demo.sqlite-shm
          test ! -e database/demo.sqlite-journal

      - name: Verify production caches and routes
        env:
          APP_NAME: LeadOps
          APP_ENV: production
          APP_DEBUG: 'false'
          APP_URL: https://leadops-ci.example.test
          APP_LOCALE: fr
          APP_FALLBACK_LOCALE: fr
          DB_CONNECTION: sqlite
          DB_DATABASE: database/demo.sqlite
          DB_READ_ONLY: 'true'
          DB_FOREIGN_KEYS: 'true'
          SESSION_DRIVER: array
          SESSION_ENCRYPT: 'true'
          SESSION_SECURE_COOKIE: 'true'
          SESSION_HTTP_ONLY: 'true'
          SESSION_SAME_SITE: lax
          CACHE_STORE: array
          QUEUE_CONNECTION: discard
          QUEUE_FAILED_DRIVER: 'null'
          LOG_CHANNEL: stderr
          LOG_LEVEL: warning
          MAIL_MAILER: array
          TRUSTED_PROXIES: '*'
        run: |
          export APP_KEY="$(php artisan key:generate --show)"
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          php artisan route:list --except-vendor
          php artisan about --only=environment
          php scripts/verify-production-runtime.php
